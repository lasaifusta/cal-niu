<script>
(function(){
  function rng(s){return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
  var rnd=rng(7),cx=470,cy=330,N=10,pins=[],tries=0;
  while(pins.length<N&&tries<20000){tries++;var x=430+rnd()*80,y=294+rnd()*72,dc=Math.hypot(x-cx,y-cy);
    if(dc<13||dc>62)continue;
    if(!pins.every(function(p){return Math.hypot(p.x-x,p.y-y)>16;}))continue; pins.push({x:x,y:y});}
  pins.sort(function(a,b){return Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy);});
  var g=document.getElementById("clPins"); if(!g) return;
  pins.forEach(function(p,i){var el=document.createElementNS("http://www.w3.org/2000/svg","g");
    el.setAttribute("class","pin"); el.setAttribute("transform","translate("+p.x.toFixed(0)+" "+p.y.toFixed(0)+")");
    el.innerHTML='<path d="M0 0 C 7 -10 7 -15 0 -21 C -7 -15 -7 -10 0 0 Z" fill="#a4664a" stroke="#fff" stroke-width="1.2"/><circle cx="0" cy="-14" r="3" fill="#fff"/>';
    p.t=2.6+i*(7.0/N); p.el=el; g.appendChild(el);});
  var ctr=document.getElementById("clCenter"),cg=document.getElementById("clCenterG"),lbl=document.getElementById("clLbl");
  var yr=document.getElementById("clYr"),ph=document.getElementById("clPh"),ct=document.getElementById("clCt"),bar=document.getElementById("clBar");
  function D(){try{return I18N[document.documentElement.lang]||I18N.ca;}catch(e){return {};}}
  var TOTAL=18, pt=[0,2.6,10,13.5];
  var start=null;
  function frame(ts){if(!start)start=ts;var e=((ts-start)/1000)%TOTAL,d=D();
    cg.style.transition="opacity .8s";cg.style.opacity=e>0.4?1:0;
    lbl.style.transition="opacity .8s";lbl.style.opacity=e>0.8?1:0;
    var n=0;pins.forEach(function(p){if(e>=p.t){p.el.classList.add("show");n++;}else{p.el.classList.remove("show");}});
    if(e>=pt[3])ctr.classList.add("pulse");else ctr.classList.remove("pulse");
    var pi=0;for(var i=0;i<pt.length;i++){if(e>=pt[i])pi=i;}
    var ys=[d.mp_p1y,d.mp_p2y,d.mp_p3y,d.mp_p4y],ps=[d.mp_p1,d.mp_p2,d.mp_p3,d.mp_p4];
    yr.textContent=ys[pi]||"";ph.textContent=ps[pi]||"";ct.textContent=n;bar.style.width=(e/TOTAL*100).toFixed(1)+"%";
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
